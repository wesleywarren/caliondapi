<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Calionda Pi Output</title>
    <style>
        :root {
            --crop-x: 50px;
            --crop-y: 50px;
            --panel-left: 400px;
            --panel-width: min(420px, calc(100vw - 430px));
            --panel-bg: rgba(15, 23, 42, 0.82);
            --panel-border: rgba(148, 163, 184, 0.28);
            --panel-text: #dbeafe;
            --panel-dim: #94a3b8;
            --panel-accent: #67e8f9;
            --status-ok: #86efac;
            --status-warn: #fcd34d;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000000;
            color: #fff;
            font-family: "Courier New", Courier, monospace;
            cursor: none;
        }

        * {
            cursor: none !important;
        }

        #pixelblaster-output {
            position: absolute;
            left: var(--crop-x);
            top: var(--crop-y);
            width: 255px;
            height: 36px;
            display: block;
            image-rendering: pixelated;
        }

        .debug-panel {
            position: absolute;
            left: var(--panel-left);
            top: 20px;
            width: var(--panel-width);
            max-height: calc(100vh - 40px);
            padding: 16px 18px;
            overflow: hidden;
            border: 1px solid var(--panel-border);
            border-radius: 14px;
            background: var(--panel-bg);
            backdrop-filter: blur(8px);
            box-sizing: border-box;
        }

        .debug-panel h1 {
            margin: 0 0 10px;
            font-size: 16px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--panel-accent);
        }

        .support-note {
            margin: 0 0 18px;
            color: var(--panel-text);
            font-size: 12px;
            line-height: 1.45;
        }

        .meta {
            display: grid;
            gap: 8px;
            margin-bottom: 12px;
            font-size: 12px;
        }

        .meta-row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
        }

        .meta-label {
            color: var(--panel-dim);
        }

        .meta-value {
            text-align: right;
        }

        .log {
            margin: 0;
            padding: 0;
            list-style: none;
            display: grid;
            gap: 6px;
            font-size: 11px;
            line-height: 1.35;
            max-height: calc(100vh - 180px);
            overflow: auto;
        }

        .log li {
            padding: 8px 10px;
            border-radius: 10px;
            background: rgba(15, 23, 42, 0.66);
            color: var(--panel-dim);
        }

        .ok {
            color: var(--status-ok);
        }

        .warn {
            color: var(--status-warn);
        }
    </style>
</head>
<body>
    <canvas id="pixelblaster-output" width="255" height="36"></canvas>

    <section class="debug-panel" aria-label="Output status">
        <h1 style="color:red">DO NOT UNPLUG OR ALTER THIS SYSTEM</h1>
        <h1>Calionda LED Controller</h1>
        <p class="support-note">Need help? Call Wes Warren at wes@calionda.com or (510) 239-9352</p>
        <div class="meta">
            <div class="meta-row">
                <span class="meta-label">Config version</span>
                <span class="meta-value" id="config-version">-</span>
            </div>
            <div class="meta-row">
                <span class="meta-label">Engine</span>
                <span class="meta-value" id="engine-type">ripples</span>
            </div>
            <div class="meta-row">
                <span class="meta-label">State source</span>
                <span class="meta-value ok" id="state-source">fallback</span>
            </div>
            <div class="meta-row">
                <span class="meta-label">Last sync</span>
                <span class="meta-value" id="last-sync">never</span>
            </div>
            <div class="meta-row">
                <span class="meta-label">Cloud sync</span>
                <span class="meta-value" id="sync-status">booting</span>
            </div>
        </div>
        <ul class="log" id="log"></ul>
    </section>

    <script src="/js/ripples-renderer.js"></script>
    <script src="/js/rain-renderer.js"></script>
    <script src="/js/clouds-renderer.js"></script>
    <script src="/js/output.js"></script>
</body>
</html>
